barre:
  couleur: PURPLE
  titre: '&dFais /parrein <pseudo> &f• &e{temps}'
recompenses:
  filleul:
    monnaies:
      ecus: 1000
      gemmes-sombres: 0
      cendres: 0
    objets:
      - type: lootbox
        id: commun
        quantite: 1
  parrain:
    monnaies:
      ecus: 2500
      gemmes-sombres: 0
      cendres: 0
