# ClikerV2 — Mariage et popularité. Modifier puis redémarrer le serveur.
mariage:
  actif: true
  fevrier-uniquement: true
  # false : seules les nouvelles demandes sont saisonnières ; les couples restent actifs.
  commandes-saisonnieres: false
  fuseau: Europe/Paris
  demande-secondes: 60
  divorce-ecus: 100000000
  # Un objet renommé ne fonctionne pas : le marqueur du plugin est obligatoire.
  # Il suffit de le tenir en main principale à la demande ET à l’acceptation.
  # Non consommé. Administration : /marry objet <joueur>.
  objet:
    material: AMETHYST_SHARD
    nom: '&dAnneau de Saint-Valentin'
    description:
      - '&7Autorise une demande en mariage hors février.'
      - '&7À tenir en main jusqu’à l’acceptation.'
      - '&7Cet objet n’est pas consommé.'
  # Les transferts ne traversent jamais les avant-postes ni les mondes d’activité.
  delai-action-secondes: 5
popularite:
  actif: true
  temps-jeu-secondes: 18000
  delai-secondes: 3600
  xp: 500
  son: ENTITY_PLAYER_LEVELUP
  echelons:
    - {seuil: 0, nom: 'Inconnu'}
    - {seuil: 10, nom: '🔹 Nouveau'}
    - {seuil: 25, nom: '🤝 Membre actif'}
    - {seuil: 50, nom: '🧲 Apprécié'}
    - {seuil: 100, nom: '💬 Estimé'}
    - {seuil: 250, nom: '📇 On le connaît'}
    - {seuil: 500, nom: '👣 Habitué'}
    - {seuil: 750, nom: '📘 Figure publique'}
    - {seuil: 1000, nom: '🔥 Populaire'}
    - {seuil: 1500, nom: '🎖 Respecté'}
    - {seuil: 2000, nom: '🏆 Icône du serveur'}
    - {seuil: 3000, nom: '⚡ Légende vivante'}
    - {seuil: 5000, nom: '🐉 Mythe'}
    - {seuil: 7500, nom: '⭐ Héros du serveur'}
    - {seuil: 10000, nom: '🌌 Divinité'}
    - {seuil: 20000, nom: '👑 Champion suprême'}
