# Holographic Displays API 3 ou secours natif. Toujours 10 places.
# Décalage relatif aux positions enregistrées, sans déplacement cumulatif aux redémarrages.
decalage-vertical: -3
entete: '&d&l{titre}'
boss-entete: '&d&l{titre}'
separateur: '&7'
ligne: '&e#{rang} &f{joueur} &7- &b{valeur}'
ligne-vide: '&e#{rang}                &7- &b0'
titres:
  LEVEL: '★ Top Niveaux ★'
  KILLS: '☠ Top Kills ★'
  ECUS: '✦ Top Écus ★'
  GEMMES: '◆ Top Gemmes Sombres ★'
  CENDRES: '❀ Top Cendres ★'
