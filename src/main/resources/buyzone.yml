# Équilibrage provisoire autorisé : Vache gratuite, autres accès = 10 pièces d’armure de la même zone.
# Les prix existants des équipements restent inchangés.
# -1 permet de désactiver une zone après personnalisation. 0 signifie gratuit.
version-prix: 2
# Les prix sont exprimés dans les unités internes : 10 gemmes-sombres = 1 gemme affichée.
dimensions:
  demi-largeur: 20
  hauteur: 10
  # Portail invisible par défaut : 40 de large, 10 de haut, 1 de profondeur.
  # Pour un volume 40 x 40 x 10, mettre profondeur: 40.
  profondeur: 1

