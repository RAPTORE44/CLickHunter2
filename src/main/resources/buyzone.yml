# Accès aux zones de ClikerV2 : tarifs à renseigner, aucun prix d'accès dans le ZIP initial.
# Un prix -1 interdit la création du portail et tout achat. 0 signifie gratuit.
# Les prix sont exprimés dans les unités internes : 10 gemmes-sombres = 1 gemme affichée.
dimensions:
  demi-largeur: 20
  hauteur: 10
  # Portail invisible par défaut : 40 de large, 10 de haut, 1 de profondeur.
  # Pour un volume 40 x 40 x 10, mettre profondeur: 40.
  profondeur: 1

