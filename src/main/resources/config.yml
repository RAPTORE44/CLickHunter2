database-file: data/economy.db
starting-balances:
  ecus: 0
  gemmes-sombres: 0
  cendres: 0

# Présentation ClickHunter demandée ; désactiver enabled si un plugin externe gère le tableau.
displays:
  scoreboard:
    enabled: true
    style-version: 1
  tab:
    enabled: true
    style-version: 1

# Bloque les apparitions vanilla, conserve les entités créées par les plugins.
mobs:
  disable-vanilla-spawns: true

# Confort de jeu : appliqué aux joueurs dans tous les mondes.
comfort:
  no-player-collisions: true
  no-hunger: true
  no-fall-damage: true
  protect-decoration: true
