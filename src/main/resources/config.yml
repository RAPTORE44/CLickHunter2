database-file: data/economy.db
starting-balances:
  ecus: 0
  gemmes-sombres: 0
  cendres: 0

# Présentation ClickHunter demandée ; désactiver enabled si un plugin externe gère le tableau.
displays:
  scoreboard:
    enabled: true
    style-version: 1
  tab:
    enabled: false

# Bloque les apparitions vanilla, conserve les entités créées par les plugins.
mobs:
  disable-vanilla-spawns: true
