name: ClikerV2
version: ${project.version}
main: fr.cliker.clikerv2.ClikerPlugin
api-version: '1.21'
author: Cliker
softdepend: [LuckPerms, DecentHolograms, ZNPCsPlus, ItemsAdder, Citizens]
commands:
  warp:
    description: Menu des destinations débloquées
  upgradebloc:
    description: Raccourci upgrade sur un bloc (administration)
    permission: cliker.services.admin
  sacbloc:
    description: Raccourci de sac sur un bloc (administration)
    permission: cliker.services.admin
  batonspawn:
    description: Bâton de placement des créatures (administration)
    permission: cliker.services.admin
  pnjservice:
    description: Gestion des PNJ AH, shop et blackmarket
    permission: cliker.services.admin
  tallisement:
    description: Collection des talismans et bonus débloqués
    aliases: [talismans, talissement]
  gm:
    description: Changer le mode de jeu ou basculer entre survie et créatif
    usage: /gm [0|1|2|3] [joueur]
    permission: cliker.gamemode.admin
  lock:
    description: Verrouiller ou déverrouiller l’équipement tenu contre le jet et la vente
    usage: /lock
    permission: cliker.comfort.use
  guide:
    description: Conseiller la prochaine amélioration selon les niveaux et le solde réel
    usage: /guide
    permission: cliker.upgrade.use
  zone:
    description: Rejoindre une zone déjà débloquée
    usage: /zone <numéro>
    aliases: [z]
    permission: cliker.navigation.use
  boss:
    description: Arène publique du boss serveur après un milliard de kills
    usage: /boss [quitter]
    permission: cliker.navigation.use
  progression:
    description: Afficher la progression des zones pendant dix secondes
    usage: /progression
    permission: cliker.navigation.use
  antidrop:
    description: Protéger ou autoriser le jet d’objets jusqu’à la déconnexion
    usage: /antidrop
    permission: cliker.comfort.use
  ramassage:
    description: Autoriser ou bloquer le ramassage au sol jusqu’à la déconnexion
    usage: /ramassage <autoriser|bloquer>
    permission: cliker.comfort.use
  settings:
    description: Régler les textes de dégâts, les sons et le confort visuel
    aliases: [parametres]
    permission: cliker.comfort.use
  bestiaire:
    description: Découvertes, gains cumulés et maîtrises par créature
    permission: cliker.bestiaire
  contrats:
    description: Contrats quotidiens de chasse et PNJ
    usage: /contrats [pnj spawn|remove]
  raid:
    description: Groupes de raids privés avec invitations et parchemin
    usage: /raid [inviter <joueur>|accepter <chef>|lancer|rejoindre|quitter]
    permission: cliker.raid
  avantposte:
    description: Terrain personnel, inventaire séparé, boutique de blocs, extensions et visites
    aliases: [is, avantpostes]
    permission: cliker.avantposte
  claim:
    description: Récupérer les récompenses en objets non livrées
    usage: /claim
    permission: cliker.claim
  parrain:
    description: Indiquer le joueur qui t’a invité
    usage: /parrain <pseudo>
    aliases: [parrainage]
    permission: cliker.parrein
  discord:
    description: Lien du Discord ClickHunter et gestion du PNJ
    usage: /discord [pnj spawn|remove]
  menu:
    description: Menu principal ClickHunter
    usage: /menu
    permission: cliker.menu
  buyzone:
    description: Créer ou supprimer un portail d'achat de zone
    usage: /buyzone spawn <zone> | /buyzone remove <zone>
  daily:
    description: Calendrier des récompenses journalières NorthBlue
    usage: /daily [pnj spawn|remove]
  ecus:
    description: Gestion des Écus
    usage: /ecus <balance|give|take|set> [joueur] [montant]
    permission: cliker.money.use
  gemmes:
    description: Gestion des Gemmes Sombres
    usage: /gemmes <balance|give|take|set> [joueur] [montant]
    aliases: [gemmessombres]
    permission: cliker.money.use
  cendres:
    description: Gestion des Cendres
    usage: /cendres <balance|give|take|set> [joueur] [montant]
    permission: cliker.money.use
  xp:
    description: Gestion de l'expérience vanilla
    usage: /xp give <joueur> <montant>
    permission: cliker.xp.admin
  mobspawn:
    description: Gestion des points d’apparition des créatures et des boss personnalisés
    usage: /mobspawn <setspawn|bossspawn|remove|removeall|list> [mob]
    aliases: [mob]
    permission: cliker.mob.admin
  epee:
    description: Donne l'épée du dresseur (+25 dégâts)
    usage: /epee
    permission: cliker.mob.admin
  stuff:
    description: Donne l’épée et l’armure d’une créature (ensemble complet = élimination en un coup)
    usage: /stuff <mob>
    permission: cliker.mob.admin
  coffre:
    description: Donne un coffre du Nether (récompenses selon la rareté)
    usage: /coffre <joueur> <rareté> [quantité]
    permission: cliker.mob.admin
  autoclick:
    description: Active/désactive l'attaque automatique sur la cible visée (cadence selon ton équipement)
    usage: /autoclick
    permission: cliker.autoclick.use
  upgrade:
    description: Ouvre les améliorations payées en Gemmes Sombres
    usage: /upgrade
    permission: cliker.upgrade.use
  stats:
    description: Ouvre le menu de statistiques du joueur
    usage: /stats
    permission: cliker.stats.use
  prestige:
    description: Ouvre le menu de prestige (niveau + mobs tués)
    usage: /prestige
    permission: cliker.prestige.use
  mobkills:
    description: Ajoute des éliminations de créatures à un joueur (tests)
    usage: /mobkills give <joueur> <montant>
    permission: cliker.mob.admin
  sell:
    description: Ouvre le menu de vente des essences de mobs
    usage: /sell
    permission: cliker.sell.use
  enchant:
    description: Ouvre la table d’enchantement (Écus)
    usage: /enchant
    permission: cliker.gear.use
  reforge:
    description: Ouvre l'enclume de reforge (Gemmes Sombres)
    usage: /reforge
    permission: cliker.gear.use
  runes:
    description: Ouvre la table de runes (Cendres)
    usage: /runes
    permission: cliker.gear.use
  compresseur:
    description: Donne un autocompresseur d’essences à activer pour une créature donnée
    usage: /compresseur <mob>
    permission: cliker.mob.admin
  pnj:
    description: Gestion des PNJ marchands (achat d’armures, d’épées et de compresseurs contre des Écus et des essences)
    usage: /pnj <spawn <mob>|remove|list|skin <mob> <pseudo|villager>>
    permission: cliker.mob.admin
  charm:
    description: Donne une amulette passive de dégâts pour une créature donnée
    usage: /charm <mob>
    permission: cliker.mob.admin
  holotop:
    description: Gestion des hologrammes de classement (DecentHolograms requis)
    usage: /holotop <spawn <level|kills|ecus|gemmes|cendres|bosstimer>|remove>
    permission: cliker.mob.admin
  ah:
    description: Hôtel des ventes, frais non remboursables et annonces chat optionnelles
    usage: /ah [vendre <prix>|sell <prix>|mesannonces]
    permission: cliker.ah.use
  tuto:
    description: Ouvre le livre-guide du serveur
    usage: /tuto
    permission: cliker.tuto.use
  spawn:
    description: Téléporte au point d’accueil du serveur
    usage: /spawn
    permission: cliker.spawn.use
  setspawn:
    description: Définit le point d’accueil du serveur à la position actuelle
    usage: /setspawn
    permission: cliker.spawn.admin
  station:
    description: Gestion des stations (table d’enchantement, enclume de reforge et table de runes)
    usage: /station <spawn <enchant|reforge|rune>|remove>
    permission: cliker.mob.admin
  sac:
    description: Ouvre tes sacs personnels de 54 cases, débloqués selon ton rang
    usage: /sac
    permission: cliker.sac.use
  talisman:
    description: Donne un talisman de trésor à un joueur
    usage: /talisman treasure <joueur>
    permission: cliker.mob.admin
permissions:
  cliker.services.admin:
    default: op
  cliker.gamemode.admin:
    default: op
  cliker.navigation.use:
    default: true
  cliker.comfort.use:
    default: true
  cliker.bestiaire:
    default: true
  cliker.contrats:
    default: true
  cliker.contrats.admin:
    default: op
  cliker.raid:
    default: true
  cliker.avantposte:
    default: true
  cliker.avantposte.admin:
    description: Modifier les avant-postes de tous les joueurs
    default: op
  cliker.claim:
    default: true
  cliker.parrein:
    default: true
  cliker.discord.use:
    default: true
  cliker.discord.admin:
    default: op
  cliker.menu:
    default: true
  cliker.buyzone.admin:
    description: Créer ou supprimer les portails d'achat de zone
    default: op
  cliker.buyzone.bypass:
    description: Traverser les portails sans devoir acheter les zones (attribution explicite)
    default: false
  cliker.daily.use:
    description: Ouvrir le calendrier et réclamer sa récompense journalière
    default: true
  cliker.daily.admin:
    description: Créer ou supprimer le PNJ des récompenses journalières
    default: op
  cliker.money.use:
